[theme]
base = "light"
primaryColor = "#4338ca"
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[server]
maxUploadSize = 30
enableXsrfProtection = true

[browser]
gatherUsageStats = false
